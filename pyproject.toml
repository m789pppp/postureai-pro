[project]
name = "postureai-pro-backend"
version = "1.0.0"
# A real Vercel build picked CPython 3.14.7 and failed ("No solution
# found... mediapipe==0.10.14 has no wheels with a matching Python ABI
# tag... we only found wheels for cp39/cp310/cp311/cp312"), which led to
# a previous, WRONG fix here: this line used to read the compound
# ">=3.12,<3.13" and got simplified down to a bare ">=3.12" on the theory
# that the compound specifier wasn't being parsed. That was backwards —
# per Vercel's own Feb 2026 changelog ("Python 3.13 and 3.14 are now
# available"): "The default will switch to Python 3.14 in the coming
# months. To continue using Python 3.12, specify an upper bound in your
# project manifest." A bare lower bound is exactly what lets it float up
# to the new default — which is why the build failed again, with the
# identical error, after that change. Restored the upper bound.
#
# api/.python-version ("3.12") stays as a second, defensive pin
# co-located with the entrypoint. mediapipe (backend/requirements.txt)
# only ships wheels through cp312, so this project cannot run on 3.13/3.14
# regardless of which pin mechanism Vercel actually honors.
requires-python = ">=3.12,<3.13"

# ── Vercel Python entrypoint ─────────────────────────────────────────
# api/main.py loads the real Flask app object from backend/backend.py
# (16,000+ lines) by explicit file path — see api/main.py's own
# docstring for why a dotted `backend.xxx` import path doesn't work
# here, and why the entrypoint file lives under api/ rather than the
# repo root (Vercel's `functions` config in vercel.json validates keys
# against files under api/ specifically on this project).
#
# Dependencies are resolved from requirements.txt at the repo root
# (which simply does `-r backend/requirements.txt` — see that file),
# per Vercel's Python runtime docs. api/requirements.txt also points
# at the same file, in case Vercel scopes dependency discovery to the
# function file's own directory when it's under api/ — see that file.
[tool.vercel]
entrypoint = "api.main:app"
