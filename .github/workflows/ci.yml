name: CI

# Runs on every push and every PR targeting main. This did not exist before —
# every commit was going straight to production (via Vercel/Railway
# auto-deploy on push to main) with only manual, ad-hoc local checks as a
# gate. This workflow is the automated gate.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend unit tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Intentionally NOT installing the full backend/requirements.txt here.
      # The test suite (tests/test_analysis.py, tests/test_comprehensive.py)
      # only imports scoring_utils.py, which has zero heavy dependencies
      # (no Flask/MediaPipe/Firebase) by design — that's what lets these
      # tests run in seconds instead of minutes. If future tests need real
      # Flask/Firebase app context, add a separate job that installs
      # requirements.txt rather than slowing this one down.
      # NOTE: this job originally only installed pytest, on the assumption
      # that every test file only imports scoring_utils.py (zero heavy
      # deps). That's no longer true — test_distance_calibration.py and
      # test_stress_correlation.py both `import backend` directly to test
      # against the real functions, which pulls in Flask/mediapipe/etc.
      # Without this, `import backend` raises ImportError inside pytest's
      # collection step and the whole job fails before running a single
      # test — which is what's been happening on every push since those
      # files were added, silently, because nobody was watching the
      # Actions tab. Installing the real requirements.txt costs a couple
      # extra minutes but means this job actually tests what it claims to.
      # Installs requirements-dev.txt (requirements.txt + pytest/etc.)
      # rather than requirements.txt directly — pytest, pytest-cov,
      # pytest-mock, and responses were moved out of the production
      # dependency list to keep the deployed Vercel Python function
      # bundle smaller (see backend/requirements-dev.txt).
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Run backend tests
        working-directory: backend
        run: pytest tests/ -v

  frontend-build:
    name: Frontend production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # --max-warnings 9999 in the script: this fails on errors only
      # (undefined variables, duplicate keys), which is the class that
      # reaches production as a blank page. Nothing ran it before.
      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npx vite build

  posture-engine:
    name: Posture engine accuracy (44 assertions)
    runs-on: ubuntu-latest
    # No `npm ci`: the engine and both harnesses import nothing outside
    # node: builtins and each other, deliberately, so this gate costs seconds.
    #
    # It exists because the engine is the product. Its numbers were tuned
    # against a synthetic subject with known joint angles — forward head reads
    # 8.0cm for a true 8cm, lateral lean 0.00 deg RMS — and nothing else in
    # this repo would notice if a refactor quietly turned one of those into
    # noise. A build that compiles is not evidence that the measurement is
    # still correct.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Engine self-test and accuracy harness
        working-directory: frontend
        run: npm run test:posture

  api-routes:
    name: API route coverage
    runs-on: ubuntu-latest
    # vercel.json routes are matched in order and the first match wins, with
    # no fall-through. A broad prefix route handed 45 backend endpoints to a
    # JS router that implements one of them, so they answered 404 in
    # production while their code sat in backend.py working fine — the whole
    # MFA login path among them. Nothing failed; the endpoints were simply
    # never reached. This check re-derives the mapping from the files and
    # fails if any caller-visible path lands on a handler that cannot serve it.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check every API path reaches a handler that implements it
        run: node scripts/check-api-routes.mjs

  firestore-rules:
    name: Firestore security rules (emulator)
    runs-on: ubuntu-latest
    # These 20 assertions are the evidence behind specific sentences in the
    # DPIA and the ethics submission — that a participant cannot read another
    # participant's sessions, that a consent withdrawal cannot be deleted,
    # that a user cannot promote themselves to admin. If one fails, a document
    # in front of a review committee is false, so it is worth a JVM in CI.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The emulator is a JVM process. ubuntu-latest ships a JDK, but pinning
      # one keeps this from breaking the day the runner image drops it.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install rules-test dependencies
        working-directory: tests/rules
        # npm install, not npm ci — no lockfile is committed for this
        # throwaway harness.
        run: npm install

      - name: Run rules assertions against the real firestore.rules
        working-directory: tests/rules
        run: npm test

  e2e-smoke:
    name: E2E smoke tests (Playwright, chromium only)
    runs-on: ubuntu-latest
    # Scoped to exactly two read-only spec files: 01-landing (visits pages,
    # clicks UI toggles, no auth) and 07-security (every request uses a
    # fake/invalid token specifically to assert it gets rejected — no real
    # auth, no data mutation, no payment flow touched). Verified this by
    # reading both files in full before pointing E2E_BASE_URL at
    # production. The OTHER 8 spec files (auth, billing, enterprise, etc.)
    # are NOT run here for exactly the reason below — do not widen the
    # `npx playwright test` file list in the step below without a real
    # staging environment, since those do exercise signup/payment/admin
    # flows that would be unsafe to run against real production data.
    if: ${{ vars.E2E_BASE_URL != '' }}
    needs: [backend-tests, frontend-build]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: e2e/package-lock.json

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        working-directory: e2e
        env:
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
          E2E_API_URL:  ${{ vars.E2E_API_URL }}
        run: npx playwright test --project=chromium tests/01-landing.spec.ts tests/07-security.spec.ts

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14
