# PostureAI Pro — Render.com Blueprint
# Deploy: render.com → New → Blueprint → connect postureai-pro repo

services:
  - type: web
    name: postureai-backend
    env: python
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --config gunicorn.conf.py "backend:app"
    healthCheckPath: /api/health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PORT
        value: 10000
      - key: PYTHON_VERSION
        value: 3.11.0
      # Set in the Render dashboard, never in this file. The previous value
      # was committed here in plaintext on 2026-06-07 and is in git history,
      # so it must be treated as disclosed and replaced rather than reused.
      #
      # For the record, because it changes how urgently this matters: nothing
      # in backend.py reads SECRET_KEY. `app.secret_key` is never assigned and
      # Flask's `session` is never imported — authentication is entirely
      # Firebase ID tokens verified per request. So the disclosed value signs
      # nothing today and there is no forgeable cookie. It still comes out of
      # the file: the moment anything starts using Flask sessions, signed
      # URLs, or itsdangerous, a key from public history would be live.
      - key: SECRET_KEY
        sync: false
      # These pointed at https://m789pppp.github.io/postureai-pro, a GitHub
      # Pages host the app no longer runs on. ALLOWED_ORIGINS is the CORS
      # allow-list, so with the stale value this backend rejected every
      # request from the actual production frontend — a Render deploy of it
      # could not have served the app at all.
      #
      # ALLOWED_ORIGINS is an origin (scheme + host), never a path: a browser
      # sends "https://host" in the Origin header, so the ".../postureai-pro"
      # entry could never have matched anything either.
      - key: APP_URL
        value: https://postureai-pro-omega-nine.vercel.app
      - key: ALLOWED_ORIGINS
        value: https://postureai-pro-omega-nine.vercel.app
      - key: ADMIN_EMAIL
        value: admin@postureai.io
      - key: SUPPORT_EMAIL
        value: support@postureai.io
      - key: ADMIN_PHONE
        value: "+201210271841"
      - key: WORK_HOURS_START
        value: 9
      - key: WORK_HOURS_END
        value: 18
      - key: CELERY_ENABLED
        value: false
      - key: SOCKETIO_ENABLED
        value: false
      # ── Add these manually in Render dashboard (secrets):
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: PAYMOB_SECRET_KEY
        sync: false
      - key: PAYMOB_PUBLIC_KEY
        sync: false
      - key: PAYMOB_INTEGRATION_CARD
        sync: false
      - key: PAYMOB_INTEGRATION_WALLET
        sync: false
      - key: PAYMOB_IFRAME_ID
        sync: false
      - key: PAYMOB_HMAC_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false
